<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task List</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 40px 20px;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  h1 {
    margin-top: 0;
    color: #222;
  }
  .top-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 20px;
  }
  .btn {
    display: inline-block;
    padding: 8px 14px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    text-decoration: none;
    color: #fff;
    margin: 0 3px;
  }
  .btn-add { background: #2e7d32; }
  .btn-add:hover { background: #256428; }
  .btn-edit { background: #1565c0; }
  .btn-edit:hover { background: #104a8f; }
  .btn-delete { background: #c62828; }
  .btn-delete:hover { background: #9e1f1f; }

  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    padding: 12px 15px;
    text-align: left;
    border-bottom: 1px solid #e0e0e0;
  }
  th {
    background: #2e3b4e;
    color: #fff;
  }
  tr:hover {
    background: #f1f5f9;
  }
  .actions {
    white-space: nowrap;
  }
  .empty {
    text-align: center;
    color: #888;
    padding: 30px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Task List</h1>
  <div class="top-bar">
    <a href="{{ url_for('add_task') }}" class="btn btn-add">+ Add Task</a>
  </div>

  {% if tasks %}
  <table>
    <thead>
      <tr>
        <th>Task Name</th>
        <th>Task Desc</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="taskBody">
      {% for task in tasks %}
      <tr>
        <td>{{ task.name }}</td>
        <td>{{ task.desc }}</td>
        <td class="actions">
          <a href="{{ url_for('edit_task', id=task.id) }}" class="btn btn-edit">Edit</a>
          <button onclick="deleteTask({{ task.id }})" class="btn btn-delete">Delete</button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <div id="emptyMsg" class="empty">No tasks yet. Click "Add Task" to create one.</div>
  {% endif %}
</div>



<script>
  async function deleteTask(id) {
    if (!confirm('Are you sure you want to delete this task?')) return;

    const response = await fetch(`/delete/${id}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      }
    });

    if (!response.ok) {
      alert('Delete failed. Please try again.');
      return;
    }

    const row = document.querySelector(`button[onclick="deleteTask(${id})"]`).closest('tr');
    if (row) {
      row.remove();
    }

    const taskBody = document.getElementById('taskBody');
    if (taskBody && taskBody.children.length === 0) {
      const emptyMsg = document.getElementById('emptyMsg');
      if (!emptyMsg) {
        const div = document.createElement('div');
        div.id = 'emptyMsg';
        div.className = 'empty';
        div.textContent = 'No tasks yet. Click "Add Task" to create one.';
        document.querySelector('.container').appendChild(div);
      }
    }
  }
</script>

</body>
</html>
